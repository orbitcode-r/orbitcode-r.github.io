<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Blur for WhatsApp</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script>
    const _s = ['en','ar','de','el','es','fr','he','hi','id','it','ja','ko','nl','pl','pt_BR','pt_PT','ru','tr','zh_CN'];
    const _r = (new URLSearchParams(location.search).get('lang') || '').replace('-', '_');
    const _l = _s.includes(_r) ? _r : 'en';
    window._i18n = fetch('i18n/' + _l + '.json')
      .then(r => r.ok ? r.json() : fetch('i18n/en.json').then(r => r.json()))
      .catch(() => fetch('i18n/en.json').then(r => r.json()));
  </script>
</head>
<body>
  <div class="card">
    <div class="brand-row">
      <img class="icon" src="logo.png" alt="Privacy Blur for WhatsApp">
      <span class="brand-name">Privacy Blur</span>
    </div>

    <div id="form-section">
      <h1 class="headline" id="headline"></h1>
      <p class="subheading" id="subheading"></p>

      <div class="scroll-area">
        <ul class="reasons" id="reasons-list"></ul>
        <textarea
          class="other-textarea"
          id="other-textarea"
          rows="3"
        ></textarea>
      </div>

      <button class="submit-btn" id="submit-btn" disabled></button>
    </div>

    <div class="thankyou" id="thankyou">
      <div class="thankyou-icon">🙏</div>
      <div class="thankyou-headline" id="thankyou-headline"></div>
      <div class="thankyou-sub" id="thankyou-sub"></div>
    </div>
  </div>

  <script src="form.js"></script>
</body>
</html>
